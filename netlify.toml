[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "https://checkoutseguro-imporiomaissabor.netlify.app/*"
  to = "https://comprasegura-imporiomaissabor.netlify.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/postback/shopify/install"
  to = "/admin.html"
  status = 302

[[redirects]]
  from = "/api/postback/shopify/installapp"
  to = "/admin.html"
  status = 302

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
